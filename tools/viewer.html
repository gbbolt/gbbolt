<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>gbbolt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6b4f'/%3E%3Ctext x='16' y='23' font-family='Consolas,Menlo,monospace' font-size='23' font-weight='700' fill='%23e0f8d0' text-anchor='middle'%3Eg%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f0f2f5; --border: #d9dde4; --text: #1d2330; --muted: #5d6678;
  --accent: #2563eb; --ok: #1a7f37; --chk: #9a6700; --fail: #cf222e; --stale: #8250df; --codec: #a9b8d3; --datac: #e3e6eb; --emptyc: #f6f7f9;
  --kw: #8250df; --num: #b35900; --com: #6e7781; --fn: #0550ae; --var: #8a5a00; --const: #0a7f8a; --reg: #c4314b; --mn: #2f7d32; --str: #0a7f8a;
  --tint: 0.13; --hot: 0.32;
  --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #161a21; --panel2: #1c212b; --border: #2a303c; --text: #d7dce5; --muted: #8a93a6;
    --accent: #6aa9ff; --ok: #3fb950; --chk: #d29922; --fail: #f85149; --stale: #a371f7; --codec: #34445e; --datac: #232832; --emptyc: #15181e;
    --kw: #c678dd; --num: #d19a66; --com: #6a7385; --fn: #61afef; --var: #e5c07b; --const: #56b6c2; --reg: #e06c75; --mn: #98c379; --str: #56b6c2;
    --tint: 0.11; --hot: 0.30;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #161a21; --panel2: #1c212b; --border: #2a303c; --text: #d7dce5; --muted: #8a93a6;
  --accent: #6aa9ff; --ok: #3fb950; --chk: #d29922; --fail: #f85149; --stale: #a371f7; --codec: #34445e; --datac: #232832; --emptyc: #15181e;
  --kw: #c678dd; --num: #d19a66; --com: #6a7385; --fn: #61afef; --var: #e5c07b; --const: #56b6c2; --reg: #e06c75; --mn: #98c379; --str: #56b6c2;
  --tint: 0.11; --hot: 0.30;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { display: flex; align-items: center; gap: 14px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .2px; font-size: 15px; }
.brand span { color: var(--muted); font-weight: 500; }
#gamesel { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { padding: 5px 11px; border-radius: 6px; color: var(--muted); font-weight: 500; }
nav a:hover { background: var(--panel2); text-decoration: none; color: var(--text); }
nav a.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.spacer { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--panel2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.st-verified { --c: var(--ok); } .st-checked { --c: var(--chk); } .st-failing { --c: var(--fail); } .st-stale { --c: var(--stale); } .st-none { --c: var(--codec); } .st-data { --c: var(--datac); }
.dot { background: var(--c, var(--muted)); }
.badge.st-verified, .badge.st-checked, .badge.st-failing, .badge.st-stale { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
input[type=search], input[type=text] { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; font: inherit; min-width: 0; }
button, .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
button.on { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; } .seg button { border-radius: 0; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; } .seg button + button { margin-left: -1px; } .seg button.on { position: relative; z-index: 1; }   /* shared borders; the selected one on top */
main { flex: 1; min-height: 0; display: flex; }
.view { flex: 1; min-width: 0; display: none; }
.view.on { display: flex; }

/* code view */
#sidebar { width: 270px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); }
#sidebar .tools { padding: 8px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); }
#sidebar .chips { display: flex; gap: 4px; flex-wrap: wrap; }
#sidebar .chips button { font-size: 12px; padding: 2px 8px; }
#fnlist { overflow: auto; flex: 1; font: 12.5px/1.2 var(--mono); }
#fnlist a { display: flex; align-items: center; gap: 7px; padding: 4px 10px; color: var(--text); white-space: nowrap; }
#fnlist a:hover { background: var(--panel2); text-decoration: none; }
#fnlist a.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
#fnlist .ad { color: var(--muted); }
#fnlist summary { display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px calc(10px + var(--d, 0) * 14px); cursor: pointer;
  list-style: none; font: 600 12.5px var(--sans); color: var(--text); user-select: none; white-space: nowrap; }
#fnlist summary::-webkit-details-marker { display: none; }
#fnlist summary::before { content: '▸'; color: var(--muted); width: 10px; flex: none; }
#fnlist details[open] > summary::before { content: '▾'; }
#fnlist summary:hover { background: var(--panel2); }
#fnlist summary .cnt { color: var(--muted); font-weight: 400; margin-left: auto; font-size: 11.5px; }
#fnlist details a { padding-left: calc(26px + var(--d, 0) * 14px); }
#card .crumb { font: 12px var(--mono); color: var(--muted); margin-bottom: 2px; }
#card .crumb a { color: var(--muted); } #card .crumb a:hover { color: var(--accent); }
#fnlist .nm { overflow: hidden; text-overflow: ellipsis; }
#fnlist a.data .nm { color: var(--muted); }
#codemain { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#card { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); flex: none; }
#card details { margin-top: 8px; }
#card summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); user-select: none; width: fit-content; }
#card summary span { font-weight: 400; margin-left: 6px; }
#card summary:hover { color: var(--text); }
#card h1 { font: 600 18px var(--mono); margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#card .meta { color: var(--muted); font-size: 12.5px; }
#card .sig { font-family: var(--mono); font-size: 13px; margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 1px 7px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--border); font: 12px var(--mono); white-space: nowrap; }
.chip b { color: var(--reg); font-weight: 600; }
#card .doc { margin: 8px 0 4px; max-width: 900px; }
#card .rows { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; margin-top: 8px; align-items: baseline; }
#card .rows > div:nth-child(odd) { color: var(--muted); }
.vbox { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--panel2); font-size: 12.5px; }
.vbox .ttl { font-weight: 600; display: flex; gap: 8px; align-items: center; }
.vbox ul { margin: 4px 0 0; padding-left: 18px; }
.vbox li.err { color: var(--fail); } .vbox li.warn { color: var(--chk); } .vbox li.info { color: var(--muted); }
.vbox table { border-collapse: collapse; margin-top: 6px; font: 12px var(--mono); }
.vbox td, .vbox th { padding: 2px 10px 2px 0; text-align: left; }
#panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, var(--lw, 1fr)) 7px minmax(0, var(--rw, 1fr)); grid-template-rows: minmax(0, 1fr); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
#splitter { cursor: col-resize; background: linear-gradient(var(--border), var(--border)) center / 1px 100% no-repeat; touch-action: none; }
#splitter:hover, #splitter.drag { background: linear-gradient(var(--accent), var(--accent)) center / 3px 100% no-repeat; }
body.resizing { cursor: col-resize; user-select: none; }
.panehead { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--border); background: var(--panel); font-size: 12px; color: var(--muted); }
.panehead .t { font-weight: 600; color: var(--text); }
.src { flex: 1; overflow: auto; font: 13px/1.55 var(--mono); font-variant-ligatures: none; padding: 6px 0 40px; tab-size: 4; }
.ln { display: flex; white-space: pre; padding: 0 10px 0 0; border-left: 3px solid transparent; min-height: 1.55em; }
.ln[data-g] { background: hsla(var(--h), 75%, 55%, var(--tint)); border-left-color: hsla(var(--h), 75%, 55%, .55); }
.ln.hot { background: hsla(var(--h), 80%, 55%, var(--hot)); border-left-color: hsl(var(--h), 80%, 55%); }
#panes.nocolor .ln[data-g]:not(.hot) { background: none; border-left-color: transparent; }   /* colours off */
/* clicked group: one outline around each run of consecutive rows */
.ln.pin-top { box-shadow: inset 0 1px hsl(var(--h), 70%, 45%); }
.ln.pin-bot { box-shadow: inset 0 -1px hsl(var(--h), 70%, 45%); }
.ln.pin-top.pin-bot { box-shadow: inset 0 1px hsl(var(--h), 70%, 45%), inset 0 -1px hsl(var(--h), 70%, 45%); }
.src .ln[data-g] { cursor: pointer; }
.ln .no { color: var(--muted); opacity: .55; width: 3.2em; text-align: right; padding-right: 12px; flex: none; user-select: none; }
.ln .ad { color: var(--muted); width: 4.2em; flex: none; padding-left: 8px; user-select: none; }
body.banked .ln .ad { width: 6.6em; }
.ln .by { color: var(--muted); opacity: .75; width: 9.5em; flex: none; overflow: hidden; user-select: none; }
.lines { width: max-content; min-width: 100%; }   /* every row as wide as the widest code */
.ln .tx { flex: none; }
/* comments wrap inside the visible width, continuing under their first character;
   contain: inline-size keeps them from widening the rows */
.ln .cm { flex: 1 1 0; min-width: 8ch; contain: inline-size; white-space: pre-wrap; overflow-wrap: anywhere; }
.hidebytes .ln .by { display: none; }
.ln.lbl .tx { color: var(--fn); font-weight: 600; }
.ln.xr { opacity: .6; border-left: 3px dashed var(--border); }   /* belongs to another function */
.ln .xref { margin-left: 14px; font: 11.5px var(--sans); color: var(--accent); white-space: nowrap; }
.ln.sep { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 4px; }
.ln.sep .tx { font: italic 12px var(--sans); color: var(--muted); padding-left: 12px; }
.placeholder { padding: 16px 18px; color: var(--muted); font: 13px/1.6 var(--sans); }
.placeholder pre { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font: 12.5px/1.5 var(--mono); overflow: auto; }
.k-kw { color: var(--kw); } .k-num { color: var(--num); } .k-com { color: var(--com); font-style: italic; } .k-str { color: var(--str); }
.k-fn { color: var(--fn); } .k-var { color: var(--var); } .k-const { color: var(--const); } .k-reg { color: var(--reg); } .k-mn { color: var(--mn); } .k-help { color: var(--const); text-decoration: underline dotted; }
a.k-fn, a.k-var { text-decoration: none; } a.k-fn:hover, a.k-var:hover { text-decoration: underline; }

/* book */
#book { flex: 1; display: flex; min-width: 0; }
#toc { display: block; width: 240px; flex: none; overflow: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 10px 0; font: 12.5px/1.3 var(--mono); }
#toc a { display: flex; gap: 7px; align-items: center; padding: 3px 12px 3px calc(12px + var(--d, 0) * 12px); color: var(--text); }
#toc a.chap { font: 600 12.5px var(--sans); margin-top: 8px; color: var(--text); }
#toc a.chap .no { color: var(--muted); font-weight: 400; }
#toc a.sec { font: 12.5px var(--sans); color: var(--muted); }
.story { max-width: 760px; margin: 6px 0 34px; font: 15px/1.6 var(--sans); color: var(--text); }
.story h3 { font: 700 16px var(--sans); margin: 26px 0 6px; scroll-margin-top: 10px; }
.story p { margin: 0 0 12px; }
.story ul { margin: 0 0 12px; padding-left: 22px; } .story li { margin: 3px 0; }
.story a.k-fn, .story a.k-var, .story code { font: 13.5px var(--mono); }
.story code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.bchap { max-width: 980px; margin: 34px 0 14px; scroll-margin-top: 10px; }
.bchap h2 { font: 700 20px var(--sans); margin: 0; } .bchap h3 { font: 700 16px var(--sans); margin: 0; } .bchap h4 { font: 600 14px var(--sans); margin: 0; }
.bchap .no { color: var(--muted); font-weight: 400; margin-right: 8px; }
.bchap p { margin: 4px 0 0; color: var(--muted); }
#bookbody { flex: 1; overflow: auto; padding: 18px 28px 80px; }
#bookbody .intro { max-width: 820px; color: var(--muted); margin-bottom: 18px; }
.imgwrap.scroll { max-width: 100%; overflow-x: auto; padding-bottom: 6px; }
.imark { position: absolute; padding: 0; border: 2px solid var(--accent); box-shadow: 0 0 0 1px rgba(255, 255, 255, .8); background: transparent; border-radius: 3px; cursor: pointer; opacity: .8; }
.imark:hover { opacity: 1; background: rgba(37, 99, 235, .15); }
.imark.sel { opacity: 1; background: color-mix(in srgb, var(--accent) 30%, transparent); }
.mpop { position: absolute; z-index: 5; line-height: 1.45; font-size: 13px; background: var(--panel); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 8px 26px 8px 10px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); white-space: normal; text-align: left; }
.mpopx { position: absolute; top: 3px; right: 5px; border: 0; background: none; color: var(--muted); font-size: 16px; line-height: 1; cursor: pointer; padding: 2px 4px; }
.mpopx:hover { color: var(--text); }
.bfn { max-width: 980px; margin: 0 0 26px; scroll-margin-top: 10px; }
.bfn h2 { font: 600 15px var(--mono); margin: 0 0 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bfn h2 .ad { color: var(--muted); font-weight: 400; }
.bfn pre { font-variant-ligatures: none; margin: 6px 0 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font: 13px/1.55 var(--mono); overflow: auto; }

/* coverage */
.scroll { flex: 1; overflow: auto; padding: 18px 24px 60px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; max-width: 1200px; }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .v { font: 600 26px var(--sans); font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 12.5px; }
.bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; display: flex; margin-top: 8px; }
.bar i { display: block; height: 100%; }
h3 { font-size: 14px; margin: 26px 0 8px; }
.banks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 1200px; margin: 8px 0 4px; }
.bank { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px; min-width: 0; }
.bank .bh { display: flex; align-items: baseline; gap: 6px; font: 600 12.5px var(--mono); white-space: nowrap; }
.bank .bh span { margin-left: auto; font: 11.5px var(--sans); color: var(--muted); }
.bank .bs { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 6px; }
.bank canvas { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; border-radius: 4px; cursor: crosshair; }
.bank.home { border-color: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
#asrc .ln.dir .tx { color: var(--muted); }
.k-mac { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
.k-mn[title] { cursor: help; text-decoration: underline dotted color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 3px; }
.mexp { margin: 2px 0 6px calc(4.2em + 7.5em); border-left: 3px solid var(--accent); background: var(--panel2); border-radius: 0 8px 8px 0; padding: 6px 10px; font: 12.5px var(--mono); }
body.banked .mexp { margin-left: calc(6.6em + 7.5em); }
.mexp-h { color: var(--muted); font-family: var(--sans); margin-bottom: 4px; }
.mexp-h span { float: right; font-family: var(--mono); font-size: 11.5px; }
.mexp-l { white-space: pre-wrap; }
.tview { padding: 14px 16px; }
.thead { font: 600 12.5px var(--sans); color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .05em; }
.tbox { white-space: pre-wrap; font: 15px/1.7 var(--mono); background: var(--screen, #e0f8d0); color: #10301c; border: 3px double #305838; border-radius: 6px; padding: 8px 14px; margin: 0 0 10px; max-width: 26ch; min-width: 20ch; }
.tname { background: rgba(48, 88, 56, .14); border-radius: 3px; padding: 0 3px; color: #1d5a33; text-decoration: none; }
.tarrow { color: #305838; margin-left: 6px; } .tend { color: #305838; margin-left: 6px; font-size: 11px; }
.tctl { color: #6a5a20; font-size: 12.5px; }
.tfar { border-left: 2px solid var(--border); padding-left: 10px; margin: 0 0 8px; }
.tfrom { font: 12px var(--sans); color: var(--muted); margin-bottom: 6px; }
.tnote { font: 13px var(--sans); color: var(--muted); margin: 4px 0 10px; }
.srams { display: grid; grid-template-columns: repeat(2, 256px); gap: 10px; }
.srams canvas { width: 256px; height: 128px; image-rendering: pixelated; border: 1px solid var(--border); border-radius: 6px; cursor: crosshair; display: block; }
.srl { font: 12px var(--mono); color: var(--muted); margin-bottom: 3px; }
#asrc .ln.off .tx, #asrc .ln.off .cm { color: var(--muted); opacity: .55; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 50%, transparent); }
#rommap { image-rendering: pixelated; border: 1px solid var(--border); border-radius: 6px; cursor: crosshair; max-width: 100%; }
#maptip { font: 12.5px var(--mono); color: var(--muted); min-height: 1.4em; }
table.grid { border-collapse: collapse; font-size: 12.5px; width: 100%; max-width: 1200px; }
table.grid th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); padding: 5px 8px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.scroll table.grid th { top: -18px; }   /* stick to the very top, over the scroll area's padding */
table.grid td { border-bottom: 1px solid var(--border); padding: 4px 8px; vertical-align: top; }
table.grid td.m { font-family: var(--mono); white-space: nowrap; }
table.grid tr.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.links a { font-family: var(--mono); font-size: 12px; margin-right: 8px; white-space: nowrap; }

/* graph */
#graphwrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#graphbar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; font-size: 13px; }
#graph { flex: 1; min-height: 0; position: relative; overflow: hidden; cursor: grab; }
#graph svg { width: 100%; height: 100%; display: block; }
#graph .node rect { fill: var(--panel); stroke: var(--c); stroke-width: 1.5; rx: 6; }
#graph .node text { font: 12px var(--mono); fill: var(--text); dominant-baseline: middle; text-anchor: middle; pointer-events: none; }
#graph .node { cursor: pointer; }
#graph .node.focus rect { stroke-width: 3; fill: color-mix(in srgb, var(--accent) 18%, var(--panel)); }
#graph .node.dim { opacity: .25; }
#graph path.e { fill: none; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.2; pointer-events: none; }
#gview.hl path.e:not(.hot) { stroke-opacity: .08; }
#gview.hl .node:not(.near) { opacity: .25; }
#gview.far text { display: none; }
#graph path.e.jump { stroke-dasharray: 5 4; }
#graph path.e.table { stroke-dasharray: 2 3; }
#graph path.e.fallthrough { stroke-width: 2.4; stroke-opacity: .35; }
#graph path.e.far { stroke: var(--stale); stroke-opacity: .75; }
.farleg { color: var(--stale); }
#graph path.e.hot { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2; }
#graph path.e.dim { stroke-opacity: .08; }
#ginfo { position: absolute; right: 12px; top: 12px; width: 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; display: none; max-height: calc(100% - 24px); overflow: auto; }

/* ram */
.memwrap { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
.hram { display: grid; grid-template-columns: repeat(16, 22px); gap: 2px; }
.hram div { height: 22px; border-radius: 3px; background: var(--panel2); border: 1px solid var(--border); font: 9px var(--mono); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: default; }
.hram div.named { background: hsla(var(--h), 65%, 50%, .45); border-color: hsla(var(--h), 65%, 50%, .9); color: var(--text); cursor: pointer; }
.hram div.unnamed { background: color-mix(in srgb, var(--chk) 30%, transparent); border-color: var(--chk); cursor: pointer; }
.hram div.sel { outline: 2px solid var(--accent); }
#wram { image-rendering: pixelated; border: 1px solid var(--border); border-radius: 6px; cursor: crosshair; }
.kbd { font: 12px var(--mono); background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
/* assets */
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; max-width: 1400px; }
.acard { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; color: var(--text); display: flex; flex-direction: column; }
.acard:hover { border-color: var(--accent); text-decoration: none; }
.acard .pv { height: 170px; display: flex; align-items: center; justify-content: center; background: var(--panel2); padding: 10px; overflow: hidden; }
.acard .pv canvas { max-width: 100%; max-height: 150px; width: auto; height: auto; min-width: 0; }
.acard .pv canvas.px { width: 100%; height: 100%; object-fit: contain; }
.acard .cap { padding: 8px 10px; font-size: 12.5px; }
.acard .cap b { font-family: var(--mono); font-weight: 600; }
.acard .cap div { color: var(--muted); }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.adetail { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.adetail > div:first-child { min-width: 0; max-width: 100%; }
.adetail.wide > div:first-child { flex: 1 1 100%; } .adetail.wide .astage { display: block; }
.astage { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: inline-block; max-width: 100%; overflow: auto; }
.ameta { min-width: 260px; flex: 1; max-width: 560px; font-size: 13px; }
.hexdump { font: 12px/1.5 var(--mono); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow: auto; max-width: 100%; white-space: pre; }
table.kv { border-collapse: collapse; font-size: 13px; }
table.kv td { padding: 4px 14px 4px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
table.kv td:first-child { color: var(--muted); white-space: nowrap; }
table.kv td.m { font-family: var(--mono); word-break: break-all; }
.okv { color: var(--ok); font-weight: 600; } .badv { color: var(--fail); font-weight: 600; }
.hdrmini { font: 12px/1.6 var(--mono); color: var(--text); }
/* music view */
#v-music { min-width: 0; }
#mlist { width: 250px; flex: none; overflow: auto; border-right: 1px solid var(--border); background: var(--panel); padding: 8px 0; font-size: 13px; }
#mlist .grp { font: 600 11.5px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 12px 12px 4px; }
#mlist a { display: flex; gap: 8px; align-items: baseline; padding: 4px 12px; color: var(--text); }
#mlist a:hover { background: var(--panel2); text-decoration: none; }
#mlist a.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
#mlist a .id { font: 11.5px var(--mono); color: var(--muted); flex: none; width: 2.2em; }
#mlist a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#mlist a .du { font: 11px var(--mono); color: var(--muted); }
#mmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#mhead { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
.mbig { width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--accent); color: var(--panel); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: none; }
.mbig svg { width: 16px; height: 16px; fill: currentColor; }
#mtitle { min-width: 180px; }
#mtitle b { font-size: 15px; }
#mtitle div { color: var(--muted); font-size: 12px; }
#mtrans { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px; }
#mtrans .track { flex: 1; height: 18px; position: relative; cursor: pointer; touch-action: none; }
#mtrans .track::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--border); }
#mtrans .fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--accent); width: 0; }
#mtrans .knob { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); left: 0; }
#mtrans .loopmark { position: absolute; top: 2px; width: 2px; height: 14px; background: var(--chk); }
#mtrans .tm { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5ch; }
#mstrips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg); }
.strip { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; border-top: 3px solid var(--cc); min-width: 0; transition: opacity .15s; }
.strip.quiet { opacity: .45; }
.strip .hd { display: flex; align-items: center; gap: 6px; font: 600 12.5px var(--sans); }
.strip .hd .sp { flex: 1; }
.strip .hd button { font: 600 11px var(--sans); padding: 1px 7px; }
.strip .hd button.mute.on { background: var(--fail); border-color: var(--fail); color: var(--panel); }
.strip .hd button.solo.on { background: var(--chk); border-color: var(--chk); color: var(--panel); }
.strip .row1 { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; height: 30px; }
.strip .note { font: 700 24px var(--mono); color: var(--cc); min-width: 2.6em; line-height: 1.1; }
.strip .hz { font: 11.5px var(--mono); color: var(--muted); }
.strip .meter { display: flex; gap: 2px; margin: 6px 0 4px; }
.strip .meter i { flex: 1; height: 7px; border-radius: 2px; background: var(--panel2); }
.strip .meter i.on { background: var(--cc); }
/* every part has a fixed height, so the strips (and the roll below) never move when a channel goes quiet */
.strip .info { display: flex; align-items: center; gap: 8px; font: 11.5px var(--mono); color: var(--muted); height: 26px; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
.strip .info svg { width: 54px; height: 22px; flex: none; }
.strip .info svg path { fill: none; stroke: var(--cc); stroke-width: 1.6; }
.strip .lr { display: inline-flex; gap: 3px; margin-left: auto; }
.strip .lr span { font: 600 10px var(--sans); width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--panel2); color: var(--muted); }
.strip .lr span.on { background: var(--cc); color: var(--panel); }
.strip .own { font: 11.5px var(--sans); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 16px; }
.strip .own.fx { color: var(--chk); font-weight: 600; }
#mstruct { padding: 6px 16px 6px 60px; border-bottom: 1px solid var(--border); background: var(--panel); position: relative; }
#mstruct:empty { display: none; }
#mstruct .srow { position: relative; height: 13px; margin: 2px 0; }
#mstruct .srow .lbl { position: absolute; left: -44px; font: 10px var(--mono); color: var(--muted); top: 0; }
#mstruct .sec { position: absolute; top: 0; height: 12px; border-radius: 3px; background: hsla(var(--h), 60%, 50%, var(--a)); font: 9.5px var(--mono); color: var(--text); overflow: hidden; white-space: nowrap; padding-left: 3px; cursor: pointer; box-sizing: border-box; border-right: 1px solid var(--panel); }
#mstruct .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--fail); pointer-events: none; }
#mstage { flex: 1; min-height: 0; position: relative; background: var(--panel); }
#mroll { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
#mtracker { position: absolute; inset: 0; overflow: auto; display: none; font: 12.5px var(--mono); }
#mtracker table { border-collapse: collapse; width: 100%; }
#mtracker th { position: sticky; top: 0; background: var(--panel); text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--border); color: var(--muted); font: 600 12px var(--sans); }
#mtracker td { padding: 2px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 50%, transparent); white-space: nowrap; cursor: pointer; }
#mtracker td.t { color: var(--muted); }
#mtracker td .n { color: var(--cc); font-weight: 700; display: inline-block; min-width: 3.2em; }
#mtracker td .x { color: var(--muted); }
#mtracker td.fx { background: color-mix(in srgb, var(--chk) 10%, transparent); }
#mtracker tr.cur td { background: color-mix(in srgb, var(--accent) 18%, transparent); }
#mtip { position: absolute; display: none; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font: 12px var(--mono); box-shadow: 0 4px 16px rgba(0, 0, 0, .15); z-index: 5; white-space: nowrap; }
#mtip b { color: var(--cc); }
.ln.target { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (max-width: 900px) { #mlist { display: none; } #mstrips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* audio player */
.card2 { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
.card2 .cside { display: flex; flex-direction: column; gap: 12px; min-width: 180px; }
.card2 .cimg { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; color: var(--muted); text-decoration: none; }
.card2 .cbody { flex: 1; min-width: min(520px, 100%); display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px 26px; align-items: start; }
.card2 .cbody section.wide { grid-column: 1 / -1; }
.card2 h4 { margin: 10px 0 6px; font: 600 13px var(--mono); color: var(--text); }
.card2 p { margin: 0 0 8px; line-height: 1.5; }
.card2 table.ctable th { text-align: left; font-weight: 600; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--border); }
.card2 table.ctable td:first-child { color: var(--text); }
.cbars { display: grid; grid-template-columns: auto 3.5ch 1fr; gap: 5px 10px; align-items: center; font-size: 13px; }
.cbars span { color: var(--muted); } .cbars b { font: 600 13px var(--mono); text-align: right; }
.cbars i { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; } .cbars em { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.cchips { display: flex; flex-wrap: wrap; gap: 6px; } .cchips > span { border: 1px solid var(--border); border-radius: 12px; padding: 2px 9px; font-size: 12.5px; }
.ctag { display: inline-block; border-radius: 4px; padding: 0 6px; font: 600 11.5px var(--mono); color: #fff; background: var(--tc, var(--muted)); }
.csound { display: flex; flex-direction: column; gap: 2px; min-width: 200px; font-size: 12.5px; }
.cprev { display: flex; justify-content: center; align-items: center; min-height: 60px; }
.cprev .cimg { background: none; border: 0; padding: 0; }
.msay { color: var(--text); font-family: var(--sans, system-ui, sans-serif); }
.mnote { max-width: 760px; line-height: 1.5; } .mmore { color: var(--text); font-family: var(--sans, inherit); margin-top: 2px; white-space: pre-line; }
table.mlist { margin-top: 14px; max-width: 900px; } table.mlist tr.on td { background: var(--panel2); } table.mlist td:first-child { color: var(--text); font-family: var(--mono); }
.imark.hot { outline: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 25%, transparent); }
table.ctable tr.hit td { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.tone.pos { color: var(--ok); font-weight: 600; } .tone.neg { color: var(--fail); font-weight: 600; } .tone.zero { color: var(--muted); text-decoration: line-through; } .tone.muted { color: var(--muted); }
.player { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.player .pp { width: 34px; height: 34px; border-radius: 50%; padding: 0; flex: none; display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); border: none; color: var(--panel); cursor: pointer; }
.player .pp:hover { filter: brightness(1.1); }
.player .pp svg { width: 14px; height: 14px; fill: currentColor; }
.player .track { flex: 1; height: 18px; position: relative; cursor: pointer; touch-action: none; }
.player .track::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--border); }
.player .fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: var(--accent); width: 0; }
.player .knob { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--accent); left: 0;
  opacity: 0; transition: opacity .15s; }
.player:hover .knob, .player.playing .knob { opacity: 1; }
.player .tm { font: 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.2ch; text-align: right; }
.player .tm.el { text-align: left; }

/* focus mode: only the two panes; the sidebar slides in over them */
.focusonly { display: none; }
body.focus .focusonly { display: inline-flex; }
body.focus header, body.focus #card { display: none; }
body.focus #sidebar { display: none; }
body.focus.drawer #sidebar { display: flex; position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; box-shadow: 4px 0 24px rgba(0, 0, 0, .25); }
#focusname { font: 600 13px var(--mono); color: var(--text); margin-right: 6px; }
#focusbtn.on { border-color: var(--accent); color: var(--accent); }
.mobileonly { display: none; }
@media (max-width: 900px) {
  /* phones and narrow windows: menus and sidebars become drawers behind ☰ buttons */
  .mobileonly, .focusonly { display: inline-flex; }
  header { gap: 8px; }
  header nav, header #search, header #buildbadge { display: none; }
  body.navopen header nav { display: flex; flex-direction: column; width: 100%; order: 10; }
  body.navopen header nav a { padding: 9px 11px; }
  body.navopen header #search { display: block; width: 100% !important; order: 11; }
  #sidebar { display: none; }
  body.drawer #sidebar { display: flex; position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; width: min(300px, 86vw); box-shadow: 4px 0 24px rgba(0, 0, 0, .25); }
  #panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  #splitter { display: none; }
  #toc { display: none; }
  body.tocopen #toc { display: block; position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; width: min(300px, 86vw); box-shadow: 4px 0 24px rgba(0, 0, 0, .25); }
  #card { max-width: 100vw; box-sizing: border-box; overflow-wrap: anywhere; }
  #card * { max-width: calc(100vw - 32px); }
  #tocbtn { position: fixed; left: 12px; bottom: 12px; z-index: 15; box-shadow: 0 2px 10px rgba(0, 0, 0, .2); }
  .panehead > span:not(.t):not(.seg):not(#focusname):not(#asmrange) { display: none; }
}
</style>
</head>
<body>
<header>
  <button id="navbtn" class="mobileonly" title="menu">☰</button>
  <div class="brand">gbbolt <span id="gametitle"></span></div>
  <nav id="nav">
    <a href="#/code" data-v="code">Code</a>
    <a href="#/book" data-v="book">Book</a>
    <a href="#/coverage" data-v="coverage">Coverage</a>
    <a href="#/graph" data-v="graph">Call graph</a>
    <a href="#/ram" data-v="ram">RAM map</a>
    <a href="#/assets" data-v="assets">Assets</a>
    <a href="#/music" data-v="music">Music</a>
  </nav>
  <div class="spacer"></div>
  <input type="search" id="search" placeholder="Jump to function or variable…" list="names" style="width:260px">

  <span id="buildbadge" class="badge"></span>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>
<main>
  <section class="view" id="v-code">
    <aside id="sidebar">
      <div class="tools">
        <div style="display:flex;gap:6px"><input type="search" id="fnfilter" placeholder="Filter…" style="flex:1"><span class="seg" id="sidemode"><button data-m="tree" title="folders">tree</button><button data-m="list" title="ROM order">list</button></span></div>
        <div class="chips" id="fnchips">
          <button data-f="all" class="on">All</button>
          <button data-f="code">Code</button>
          <button data-f="todo">To do</button>
          <button data-f="data">Data</button>
        </div>
      </div>
      <div id="fnlist"></div>
    </aside>
    <div id="codemain">
      <div id="card"></div>
      <div id="panes">
        <div class="pane">
          <div class="panehead"><button id="drawerbtn" class="focusonly" title="functions (tree / list)">☰</button><span id="focusname" class="focusonly"></span><span class="t">Pseudo-code</span><span id="pmode" class="seg"><button data-m="py" class="on">Python</button><button data-m="c">C-style</button></span><span class="spacer"></span><span>hover a line to see its instructions</span></div>
          <div class="src" id="psrc"></div>

          <div class="src" id="asrc"></div>
        </div>
      </div>
    </div>
  </section>
  <section class="view" id="v-book">
    <div id="book"><nav id="toc"></nav><div id="bookbody"></div><button id="tocbtn" class="mobileonly">☰ chapters</button></div>
  </section>
  <section class="view" id="v-coverage"><div class="scroll" id="coverage"></div></section>
  <section class="view" id="v-graph">
    <div id="graphwrap">
      <div id="graphbar">
        <span class="seg" id="gmode"><button data-m="all" class="on">Whole program</button><button data-m="nb">Neighbourhood</button></span>
        <label id="gdepthl">depth <select id="gdepth"><option>1</option><option selected>2</option><option>3</option></select></label>
        <label id="gfolderl">folder <select id="gfolder"></select></label>

        <span class="spacer"></span>
        <div class="legend" style="margin:0">
          <span><i style="background:var(--ok)"></i>verified</span><span><i style="background:var(--chk)"></i>checked</span><span><i style="background:var(--fail)"></i>failing</span><span><i style="background:var(--codec)"></i>not annotated</span>
          <span>— call</span><span>- - jump</span><span>··· table</span><span>━ falls through</span><span class="farleg" id="farleg" hidden>— far call (other bank)</span>
        </div>
        <button id="gfit">Fit</button>
      </div>
      <div id="graph"><svg id="gsvg"><g id="gview"></g></svg><div id="ginfo"></div></div>
    </div>
  </section>
  <section class="view" id="v-ram"><div class="scroll" id="ram"></div></section>

      <div id="mstage"><canvas id="mroll"></canvas><div id="mtracker"></div><div id="mtip"></div></div>

</main>
<script>
const D = /*__GBBOLT_DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hex4 = a => '$' + a.toString(16).toUpperCase().padStart(4, '0');
// a ROM place: its offset in the ROM file. Banked games show it as bank:address (0E:5A2F)
const romBank = a => a < 0x4000 ? 0 : a >> 14;
const romCpu = a => a < 0x4000 ? a : 0x4000 | (a & 0x3FFF);

// ---------------------------------------------------------------- music view
// Piano roll of the game's sound engine output: per channel the notes with their
// frequency and volume frame by frame (envelopes fade, sweeps slant, vibrato
// wobbles), mixer strips with the channel settings at the playhead, the song's
// pattern structure, a tracker table, and mute / solo over 4 per-channel tracks.
const AUDIO = (D.audio && D.audio.items) || [];
const AUDIO_KINDS = (D.audio && D.audio.kinds) || {};
const CH_NAMES = ['Square 1', 'Square 2', 'Wave', 'Noise'];
const CH_HUE = [24, 200, 280, 145];
const chColor = (i, a) => `hsla(${CH_HUE[i]}, 72%, ${document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches) ? 62 : 46}%, ${a})`;
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const itemKey = it => `${it.kind}_${it.id.toString(16).toUpperCase().padStart(2, '0')}`;
const tlKey = it => `${it.kind} ${it.id}`;
const hzOf = (ch, f) => ch === 2 ? 65536 / (2048 - f) : 131072 / (2048 - f);
const noiseHz = n => 524288 / (n[2] || 0.5) / Math.pow(2, n[0] + 1);
const midiOf = hz => 69 + 12 * Math.log2(hz / 440);
const noteName = m => { const r = Math.round(m); return NOTE_NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1); };
const fmtT = (s, total) => mmss(s, total);
function unitAt(a) {
  let lo = 0, hi = D.units.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (D.units[m].s <= a) lo = m; else hi = m - 1; }
  const u = D.units[lo];
  return u && u.s <= a && a < u.e ? u : null;
}
function soundName(own) {                 // 'sfx 7' -> the effect's name from src/sound.json
  const [k, n] = own.split(' ');
  const it = AUDIO.find(x => x.kind === k && x.id === +n);
  return it ? it.name : own;
}

const music = {
  item: null, tl: null, view: localStorage.getItem('gbbolt.mview') || 'roll',
  pps: +(localStorage.getItem('gbbolt.mzoom') || 140),      // pixels per second
  els: [], mute: [false, false, false, false], solo: [false, false, false, false],
  playing: false, t: 0, follow: true, viewT0: 0, raf: 0, lastFrame: -1,
};

function loadTimeline(it, cb) {
  const key = tlKey(it);
  if (window.GB_TIMELINES && window.GB_TIMELINES[key]) return cb(window.GB_TIMELINES[key]);
  const s = document.createElement('script');
  s.src = it.timeline;
  s.onload = () => cb((window.GB_TIMELINES || {})[key]);
  s.onerror = () => cb(null);
  document.head.appendChild(s);
}

function renderMusic(arg) {
  if (!AUDIO.length) {
    $('#mmain').innerHTML = '<div class="placeholder">No sound rendered yet: run <span class="kbd">python tools/audio.py</span>, then <span class="kbd">python tools/gbbolt.py site</span>.</div>';
    return;
  }
  const it = AUDIO.find(x => itemKey(x) === arg) || (music.item && AUDIO.includes(music.item) ? music.item : AUDIO[0]);
  // the list
  const kinds = [...new Set(AUDIO.map(x => x.kind))];
  $('#mlist').innerHTML = kinds.map(k => `<div class="grp">${esc(AUDIO_KINDS[k] || k)}</div>` + AUDIO.filter(x => x.kind === k).map(x =>
    `<a href="#/music/${itemKey(x)}" class="${x === it ? 'on' : ''}"><span class="id">${x.id.toString(16).toUpperCase().padStart(2, '0')}</span><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span><span class="du">${x.loop !== null && x.loop !== undefined ? '↻' : ''}${fmtT(x.seconds, x.seconds)}</span></a>`).join('')).join('');
  if (music.item === it) return;
  musicStop();
  music.item = it; music.tl = null; music.t = 0; music.viewT0 = 0; music.follow = true; music.lastFrame = -1;
  music.mute = [false, false, false, false]; music.solo = [false, false, false, false];   // every sound starts with all channels on
  $('#mtitle').innerHTML = `<b>${esc(it.name)}</b><div>${esc(it.kind)} $${it.id.toString(16).toUpperCase().padStart(2, '0')} · requested by ${hl(it.usedBy || '—', 'doc')}${it.loop !== null && it.loop !== undefined ? ` · loops from ${fmtT(it.loop, it.seconds)}` : ''}</div>`;
  music.els.forEach(a => { a.pause(); a.src = ''; });
  music.els = (it.stems || [it.file]).map(src => { const a = new Audio(); a.preload = 'auto'; a.src = src; return a; });
  music.els[0].addEventListener('ended', musicEnded);
  applyMute();
  setPlayIcon(false);
  $('#mtrack').querySelectorAll('.loopmark').forEach(e => e.remove());
  if (it.loop !== null && it.loop !== undefined && it.loop > 0) {
    const m = document.createElement('div'); m.className = 'loopmark'; m.style.left = (100 * it.loop / it.seconds) + '%'; m.title = 'loop point';
    $('#mtrack').appendChild(m);
  }
  $('#mstrips').innerHTML = CH_NAMES.map((n, i) => `<div class="strip" data-ch="${i}" style="--cc:${chColor(i, 1)}">
    <div class="hd"><span>${n}</span><span class="sp"></span><button class="mute" title="mute">M</button><button class="solo" title="solo">S</button></div>
    <div class="row1"><span class="note">—</span><span class="hz"></span></div>
    <div class="meter">${'<i></i>'.repeat(15)}</div>
    <div class="info"></div><div class="own"></div></div>`).join('');
  $$('#mstrips .strip').forEach(s => {
    const i = +s.dataset.ch;
    $('.mute', s).onclick = () => { music.mute[i] = !music.mute[i]; applyMute(); };
    $('.solo', s).onclick = () => { music.solo[i] = !music.solo[i]; applyMute(); };
  });
  applyMute();
  $('#mstruct').innerHTML = '';
  loadTimeline(it, tl => {
    if (music.item !== it) return;
    music.tl = tl;
    if (tl) {
      tl.maxVol = tl.ch.map(ns => Math.max(1, ...ns.map(n => Math.max(...n.v.map(v => v[1])))));
      const nh = tl.ch[3].map(n => Math.log2(noiseHz(n.noise || [0, 0, 0])));
      tl.noiseRange = nh.length ? [Math.min(...nh) - 0.5, Math.max(...nh) + 0.5] : [8, 20];
      const w = $('#mroll').clientWidth - 46;
      music.fit = it.seconds * music.pps < w * 0.6 ? w * 0.92 / it.seconds : 0;
    }
    if (!tl) { $('#mtracker').innerHTML = '<div class="placeholder">Timeline missing - run tools/audio.py again.</div>'; return; }
    buildStructure(); buildTracker(); setView(music.view); drawMusic(true);
  });
  updateTransport();
}

function applyMute() {
  const anySolo = music.solo.some(Boolean);
  music.els.forEach((a, i) => { a.muted = music.els.length === 4 ? (anySolo ? !music.solo[i] : music.mute[i]) : false; });
  $$('#mstrips .strip').forEach(s => {
    const i = +s.dataset.ch;
    $('.mute', s).classList.toggle('on', music.mute[i]);
    $('.solo', s).classList.toggle('on', music.solo[i]);
    s.classList.toggle('quiet', anySolo ? !music.solo[i] : music.mute[i]);
  });
}
function setPlayIcon(on) { $('#mplay').innerHTML = on ? ICON_PAUSE : ICON_PLAY; $('#mplay').setAttribute('aria-label', on ? 'pause' : 'play'); }
function musicPlay() {
  if (!music.item) return;
  player.stop();
  if (music.t >= music.item.seconds - 0.02) music.t = 0;
  music.els.forEach(a => { a.currentTime = music.t; });
  Promise.all(music.els.map(a => a.play().catch(() => {}))).then(() => {});
  music.playing = true; music.follow = true; setPlayIcon(true);
  if (!music.raf) music.raf = requestAnimationFrame(musicTick);
}
function musicStop() {
  music.els.forEach(a => a.pause());
  music.playing = false; setPlayIcon(false);
  cancelAnimationFrame(music.raf); music.raf = 0;
}
function musicSeek(t) {
  music.t = Math.max(0, Math.min(t, music.item ? music.item.seconds : 0));
  music.els.forEach(a => { try { a.currentTime = music.t; } catch (e) {} });
  music.follow = true;
  drawMusic(true);
}
function musicEnded() {
  const it = music.item;
  if (it && it.loop !== null && it.loop !== undefined && music.playing) { musicSeek(it.loop); musicPlay(); }
  else { musicStop(); music.t = it ? it.seconds : 0; drawMusic(true); }
}
let lastSync = 0;
function musicTick(now) {
  music.raf = 0;
  if (!music.playing) return;
  const m = music.els[0];
  music.t = m.currentTime;
  if (now - lastSync > 300) {               // keep the 4 tracks together
    lastSync = now;
    music.els.slice(1).forEach(a => { if (Math.abs(a.currentTime - music.t) > 0.04) a.currentTime = music.t; });
  }
  if (music.item.loop !== null && music.item.loop !== undefined && music.t >= music.item.seconds - 0.03) { musicSeek(music.item.loop); }
  drawMusic(false);
  music.raf = requestAnimationFrame(musicTick);
}
$('#mplay').onclick = () => (music.playing ? musicStop() : musicPlay());
document.addEventListener('keydown', e => {
  if (current.view !== 'music' || e.target.matches('input, textarea') || e.code !== 'Space') return;
  e.preventDefault(); music.playing ? musicStop() : musicPlay();
});
(function () {                              // transport seek bar
  const tr = $('#mtrack');
  tr.addEventListener('pointerdown', e => {
    if (!music.item) return;
    const r = tr.getBoundingClientRect(), frac = ev => Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    tr.setPointerCapture(e.pointerId);
    musicSeek(frac(e) * music.item.seconds);
    const move = ev => musicSeek(frac(ev) * music.item.seconds);
    const up = () => { tr.removeEventListener('pointermove', move); tr.removeEventListener('pointerup', up); };
    tr.addEventListener('pointermove', move); tr.addEventListener('pointerup', up);
  });
})();
function updateTransport() {
  const it = music.item; if (!it) return;
  const f = it.seconds ? music.t / it.seconds : 0;
  $('#mtrack .fill').style.width = f * 100 + '%';
  $('#mtrack .knob').style.left = f * 100 + '%';
  $('#mel').textContent = fmtT(music.t, it.seconds);
  $('#mleft').textContent = '-' + fmtT(it.seconds - music.t, it.seconds);
}
$$('#mviewsel button').forEach(b => b.onclick = () => setView(b.dataset.v));
function setView(v) {
  music.view = v; localStorage.setItem('gbbolt.mview', v);
  $$('#mviewsel button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  $('#mroll').style.display = v === 'roll' ? '' : 'none';
  $('#mtracker').style.display = v === 'tracker' ? 'block' : 'none';
  $('#mzoom').style.display = v === 'roll' ? '' : 'none';
  drawMusic(true);
}
$$('#mzoom button').forEach(b => b.onclick = () => {
  music.pps = Math.max(20, Math.min(4000, (music.fit || music.pps) * (b.dataset.z > 0 ? 1.5 : 1 / 1.5))); music.fit = 0;
  localStorage.setItem('gbbolt.mzoom', Math.round(music.pps)); drawMusic(true);
});

// --- note lookup helpers
function noteAt(ch, frame) {                // the note sounding on channel ch at a frame
  const ns = music.tl.ch[ch];
  let lo = 0, hi = ns.length - 1, best = null;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (ns[m].t <= frame) { best = m; lo = m + 1; } else hi = m - 1; }
  if (best === null) return null;
  const n = ns[best];
  return frame < n.t + n.d ? n : null;
}
const valAt = (pairs, k) => { let v = pairs[0][1]; for (const [o, x] of pairs) { if (o > k) break; v = x; } return v; };
const listAt = (pairs, frame) => { let v = pairs.length ? pairs[0][1] : 0; for (const [f, x] of pairs) { if (f > frame) break; v = x; } return v; };
function pitchOf(ch, n, freq) { return ch === 3 ? null : midiOf(hzOf(ch, freq)); }

// --- drawing
function drawMusic(full) {
  const it = music.item, tl = music.tl;
  updateTransport();
  if (!it || !tl) return;
  const frame = Math.min(tl.frames - 1, Math.floor(music.t * tl.fps));
  if (frame !== music.lastFrame || full) { updateStrips(frame); music.lastFrame = frame; }
  // structure playhead
  const ph = $('#mstruct .ph'); if (ph) ph.style.left = (100 * music.t / it.seconds) + '%';
  if (music.view === 'tracker') { trackerFollow(frame); return; }
  drawRoll();
}

function rollGeometry() {
  const tl = music.tl, cv = $('#mroll');
  const W = cv.clientWidth, H = cv.clientHeight;
  let lo = 127, hi = 0;
  for (let ch = 0; ch < 3; ch++) for (const n of tl.ch[ch]) for (const [, f] of n.f) {
    if (f >= 2048) continue;
    const m = midiOf(hzOf(ch, f)); if (m < lo) lo = m; if (m > hi) hi = m;
  }
  if (lo > hi) { lo = 48; hi = 84; }
  lo = Math.floor(lo) - 2; hi = Math.ceil(hi) + 2;
  const hasNoise = tl.ch[3].length > 0;
  const tonal = tl.ch.slice(0, 3).some(ns => ns.length);
  const noiseH = !hasNoise ? 0 : tonal ? Math.min(90, Math.max(44, H * 0.16)) : H * 0.62;   // noise only: give it the room
  const top = 22, gutter = 46;
  const pitchH = H - top - noiseH - (hasNoise ? 10 : 0) - 6;
  const row = pitchH / (hi - lo + 1);
  return {W, H, lo, hi, row, top, gutter, noiseTop: top + pitchH + 10, noiseH};
}

function drawRoll() {
  const it = music.item, tl = music.tl, cv = $('#mroll');
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(cv.clientWidth * dpr) || cv.height !== Math.round(cv.clientHeight * dpr)) {
    cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr);
  }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = music.geo = rollGeometry();
  const pps = music.fit || music.pps;
  const span = (g.W - g.gutter) / pps;
  if (music.follow && music.playing) music.viewT0 = Math.max(0, music.t - span * 0.25);
  if (music.follow && !music.playing && (music.t < music.viewT0 || music.t > music.viewT0 + span)) music.viewT0 = Math.max(0, music.t - span * 0.25);
  const t0 = music.viewT0, x = t => g.gutter + (t - t0) * pps;
  const yOf = m => g.top + (g.hi - m) * g.row;
  const css = n => cssVar(n);
  ctx.fillStyle = css('--panel'); ctx.fillRect(0, 0, g.W, g.H);
  // pitch grid: octave lines, black keys shaded
  for (let m = g.lo; m <= g.hi; m++) {
    const y = yOf(m) - g.row / 2;
    if ([1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12)) { ctx.fillStyle = css('--panel2'); ctx.fillRect(g.gutter, y, g.W, g.row); }
    if (((m % 12) + 12) % 12 === 0) {
      ctx.fillStyle = css('--border'); ctx.fillRect(g.gutter, y + g.row, g.W, 1);
      ctx.fillStyle = css('--muted'); ctx.font = '10px ' + css('--mono'); ctx.textBaseline = 'middle';
      ctx.fillText('C' + (m / 12 - 1), 8, y + g.row / 2);
    }
  }
  // time grid
  ctx.font = '10px ' + css('--mono'); ctx.textBaseline = 'top';
  const step = pps > 1200 ? 0.05 : pps > 600 ? 0.1 : pps > 300 ? 0.25 : pps > 90 ? 1 : pps > 40 ? 2 : 5;
  for (let s = Math.ceil(t0 / step - 1e-9) * step; s < t0 + (g.W - g.gutter) / pps; s += step) {
    const xx = x(s);
    ctx.fillStyle = css('--border'); ctx.fillRect(xx, g.top - 4, 1, g.H - g.top);
    ctx.fillStyle = css('--muted'); ctx.fillText(fmtT(s, it.seconds), xx + 3, 4);
  }
  if (tl.loopStart) { const lx = x(tl.loopStart / tl.fps); ctx.fillStyle = css('--chk'); ctx.fillRect(lx, 0, 2, g.H); ctx.fillText('loop', lx + 4, 4); }
  if (g.noiseH) {
    ctx.fillStyle = css('--panel2'); ctx.fillRect(g.gutter, g.noiseTop, g.W, g.noiseH);
    ctx.fillStyle = css('--muted'); ctx.fillText('noise', 6, g.noiseTop + 2);
  }
  // notes: one rectangle per run of constant frequency and volume
  const fps = tl.fps, f0 = Math.floor(t0 * fps), f1 = Math.ceil((t0 + (g.W - g.gutter) / pps) * fps);
  const playFrame = Math.floor(music.t * fps);
  const lastFx = [null, null, null, null];
  for (let ch = 0; ch < 4; ch++) {
    for (const n of tl.ch[ch]) {
      if (n.t > f1 || n.t + n.d < f0) { if (n.own !== 'music') lastFx[ch] = {own: n.own, end: n.t + n.d}; continue; }
      const fx = n.own !== 'music';
      const active = playFrame >= n.t && playFrame < n.t + n.d;
      const cuts = [...new Set([0, ...n.f.map(p => p[0]), ...n.v.map(p => p[0]), n.d])].filter(k => k <= n.d).sort((a, b) => a - b);
      for (let k = 0; k < cuts.length - 1; k++) {
        const a = cuts[k], b = cuts[k + 1], freq = valAt(n.f, a), vol = valAt(n.v, a);
        if (!vol) continue;
        const xa = x((n.t + a) / fps), xb = x((n.t + b) / fps);
        let yc, hgt;
        const norm = vol / tl.maxVol[ch];          // relative to the loudest moment of this channel
        if (ch === 3) {
          const nz = n.noise || [0, 0, 0], [lo, hi] = tl.noiseRange;
          const frac = Math.min(1, Math.max(0, (Math.log2(noiseHz(nz)) - lo) / (hi - lo || 1)));
          yc = g.noiseTop + 6 + (g.noiseH - 12) * (1 - frac); hgt = Math.max(4, g.noiseH * 0.22) * (0.45 + 0.55 * norm);
        } else {
          if (freq >= 2048) continue;
          yc = yOf(midiOf(hzOf(ch, freq))); hgt = Math.max(3, (g.row - 1) * (0.45 + 0.55 * norm));
        }
        ctx.fillStyle = chColor(ch, (active ? 0.5 : 0.3) + 0.6 * norm);
        ctx.fillRect(xa, yc - hgt / 2, Math.max(1, xb - xa - 0.25), hgt);
        if (fx) {                                // owned by an effect: amber top and bottom edges
          ctx.fillStyle = css('--chk');
          ctx.fillRect(xa, yc - hgt / 2 - 1, Math.max(1, xb - xa), 1.5);
          ctx.fillRect(xa, yc + hgt / 2 - 0.5, Math.max(1, xb - xa), 1.5);
        }
      }
      if (fx && !(lastFx[ch] && lastFx[ch].own === n.own && n.t - lastFx[ch].end < 30)) {   // label each run of effect notes once
        const xs = x(n.t / fps), xe = x((n.t + n.d) / fps);
        const freq0 = n.f[0][1];
        const yl = ch === 3 ? g.noiseTop + 10 : yOf(midiOf(hzOf(ch, Math.min(2047, freq0)))) - g.row - 2;
        ctx.fillStyle = css('--chk'); ctx.font = '600 10px ' + css('--sans'); ctx.textBaseline = 'bottom'; ctx.fillText(n.own, xs, yl);
      }
      if (fx) lastFx[ch] = {own: n.own, end: n.t + n.d};
    }
  }
  // playhead
  const px = x(music.t);
  ctx.fillStyle = css('--fail'); ctx.fillRect(px - 1, 0, 2, g.H);
  // keyboard gutter
  ctx.fillStyle = css('--panel'); ctx.fillRect(0, g.top, g.gutter - 4, g.H);
  ctx.fillStyle = css('--muted'); ctx.font = '10px ' + css('--mono'); ctx.textBaseline = 'middle';
  for (let m = g.lo; m <= g.hi; m++) if (((m % 12) + 12) % 12 === 0) ctx.fillText('C' + (m / 12 - 1), 8, yOf(m));
  if (g.noiseH) ctx.fillText('noise', 6, g.noiseTop + g.noiseH / 2);
}

// roll interaction: wheel / drag scrolls (stops following), hover shows a note, click seeks or opens its byte
(function () {
  const cv = $('#mroll');
  let drag = null;
  cv.addEventListener('wheel', e => {
    if (!music.tl) return;
    e.preventDefault();
    if (e.ctrlKey) { music.pps = Math.max(20, Math.min(4000, (music.fit || music.pps) * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); music.fit = 0; localStorage.setItem('gbbolt.mzoom', Math.round(music.pps)); }
    else { music.viewT0 = Math.max(0, music.viewT0 + (e.deltaX || e.deltaY) / (music.fit || music.pps)); music.follow = false; }
    drawMusic(true);
  }, {passive: false});
  cv.addEventListener('pointerdown', e => { drag = {x: e.clientX, t0: music.viewT0, moved: false}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (drag && Math.abs(e.clientX - drag.x) > 3) {
      drag.moved = true; music.follow = false;
      music.viewT0 = Math.max(0, drag.t0 - (e.clientX - drag.x) / (music.fit || music.pps)); drawMusic(true);
    }
    showTip(e);
  });
  cv.addEventListener('pointerup', e => {
    const d = drag; drag = null;
    if (!d || d.moved || !music.tl) return;
    const g = music.geo, r = cv.getBoundingClientRect();
    if (e.clientX - r.left > g.gutter) musicSeek(music.viewT0 + (e.clientX - r.left - g.gutter) / (music.fit || music.pps));
  });
  cv.addEventListener('dblclick', e => { const hit = hitNote(e); if (hit && hit.n.src !== undefined) openSource(hit.n.src); });
  cv.addEventListener('pointerleave', () => { $('#mtip').style.display = 'none'; });
})();
function hitNote(e) {
  const g = music.geo, tl = music.tl; if (!g || !tl) return null;
  const r = $('#mroll').getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const frame = Math.floor((music.viewT0 + (mx - g.gutter) / (music.fit || music.pps)) * tl.fps);
  let best = null;
  for (let ch = 3; ch >= 0; ch--) {
    const n = noteAt(ch, frame); if (!n) continue;
    const k = frame - n.t, freq = valAt(n.f, k), vol = valAt(n.v, k);
    let yc;
    if (ch === 3) { if (my < g.noiseTop || my > g.noiseTop + g.noiseH) continue; yc = my; }
    else { if (freq >= 2048) continue; yc = g.top + (g.hi - midiOf(hzOf(ch, freq))) * g.row; }
    const dist = Math.abs(my - yc);
    if (dist <= Math.max(5, g.row) && (!best || dist < best.dist)) best = {ch, n, k, freq, vol, dist};
  }
  return best;
}
function showTip(e) {
  const tip = $('#mtip'), hit = hitNote(e);
  if (!hit) { tip.style.display = 'none'; return; }
  const {ch, n, freq, vol} = hit, tl = music.tl;
  const lines = [`<b style="--cc:${chColor(ch, 1)};color:${chColor(ch, 1)}">${CH_NAMES[ch]}</b>  ${ch === 3 ? 'noise' : noteName(midiOf(hzOf(ch, freq)))}` + (ch === 3 ? '' : `  ${hzOf(ch, freq).toFixed(1)} Hz`)];
  lines.push(`${(n.d / tl.fps).toFixed(2)} s (${n.d} frames) · volume ${vol}/15`);
  if (n.duty !== undefined) lines.push(`duty ${['12.5', '25', '50', '75'][n.duty]}%`);
  if (n.env) lines.push(`envelope: start ${n.env[0]}, ${n.env[2] ? (n.env[1] ? 'up' : 'down') + ' every ' + n.env[2] + '/64 s' : 'steady'}`);
  if (n.sweep) lines.push(`sweep: ${n.sweep[1] ? 'down' : 'up'}, shift ${n.sweep[2]}, every ${n.sweep[0]}/128 s`);
  if (n.noise) lines.push(`noise: ${n.noise[1] ? '7-bit (metallic)' : '15-bit'}, shift ${n.noise[0]}, divider ${n.noise[2]}`);
  if (n.wave !== undefined) lines.push(`waveform #${n.wave + 1}`);
  lines.push(n.own === 'music' ? 'music' : `effect: ${esc(soundName(n.own))} (${n.own})`);
  if (n.src !== undefined) { const u = unitAt(n.src); lines.push(`pattern byte ${romAddr(n.src)}${u ? ' in ' + esc(u.n) : ''} — double-click to open`); }
  tip.innerHTML = lines.join('<br>');
  const r = $('#mstage').getBoundingClientRect();
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY - r.top + 14, r.height - tip.offsetHeight - 8) + 'px';
}
function openSource(addr) {
  const u = unitAt(addr);
  if (u) location.hash = `#/code/${encodeURIComponent(u.n)}@${addr.toString(16).toUpperCase().padStart(4, '0')}`;
}

// --- mixer strips
function dutySvg(d) {
  const w = [0.125, 0.25, 0.5, 0.75][d] * 18;
  let p = 'M0,18';
  for (let k = 0; k < 3; k++) { const x0 = k * 18; p += ` L${x0},4 L${x0 + w},4 L${x0 + w},18 L${x0 + 18},18`; }
  return `<svg viewBox="0 0 54 22"><path d="${p}"/></svg>`;
}
function waveSvg(hex) {
  const s = []; for (let i = 0; i < 16; i++) { const b = parseInt(hex.substr(i * 2, 2), 16); s.push(b >> 4, b & 15); }
  return `<svg viewBox="0 0 54 22"><path d="${s.map((v, i) => `${i ? 'L' : 'M'}${(i * 54 / 31).toFixed(1)},${(20 - v * 1.2).toFixed(1)}`).join(' ')}"/></svg>`;
}
function updateStrips(frame) {
  const tl = music.tl;
  const pan = listAt(tl.pan, frame);
  $$('#mstrips .strip').forEach(s => {
    const ch = +s.dataset.ch, n = noteAt(ch, frame);
    const k = n ? frame - n.t : 0, freq = n ? valAt(n.f, k) : 0, vol = n ? valAt(n.v, k) : 0;
    $('.note', s).textContent = n && vol ? (ch === 3 ? 'noise' : noteName(midiOf(hzOf(ch, freq)))) : '—';
    $('.hz', s).textContent = n && vol ? (ch === 3 ? noiseHz(n.noise).toFixed(0) + ' Hz clock' : hzOf(ch, freq).toFixed(1) + ' Hz · $' + freq.toString(16).toUpperCase().padStart(3, '0')) : '';
    $$('.meter i', s).forEach((m, i) => m.classList.toggle('on', i < vol));
    let info = '';
    if (n) {
      if (n.duty !== undefined) info += dutySvg(n.duty) + `${['12.5', '25', '50', '75'][n.duty]}%`;
      if (n.wave !== undefined && tl.waves[n.wave]) info += waveSvg(tl.waves[n.wave]) + `wave #${n.wave + 1}`;
      if (n.noise) info += `${n.noise[1] ? '7-bit' : '15-bit'} s${n.noise[0]} d${n.noise[2]}`;
      if (n.env) info += ` · env ${n.env[0]}${n.env[2] ? (n.env[1] ? '↑' : '↓') + n.env[2] : ''}`;
      if (n.sweep) info += ` · sweep ${n.sweep[1] ? '↓' : '↑'}${n.sweep[2]}/${n.sweep[0]}`;
    }
    info += `<span class="lr" title="panning (NR51)"><span class="${pan & (1 << (ch + 4)) ? 'on' : ''}">L</span><span class="${pan & (1 << ch) ? 'on' : ''}">R</span></span>`;
    $('.info', s).innerHTML = info;
    const own = $('.own', s), fx = n && n.own !== 'music';
    own.textContent = n ? (fx ? 'effect: ' + soundName(n.own) : 'music') : '';
    own.classList.toggle('fx', !!fx);
  });
}

// --- song structure (pattern list) strip
function buildStructure() {
  const tl = music.tl, it = music.item, el = $('#mstruct');
  if (!tl.sections || !tl.sections.some(s => s.length)) { el.innerHTML = ''; return; }
  const total = tl.frames;
  el.innerHTML = tl.sections.map((secs, ch) => {
    if (!secs.length) return '';
    const pats = [...new Set(secs.map(s => s[1]))];
    return `<div class="srow"><span class="lbl" style="color:${chColor(ch, 1)}">${['sq1', 'sq2', 'wave', 'noise'][ch]}</span>` + secs.map((s, i) => {
      const end = i + 1 < secs.length ? secs[i + 1][0] : total;
      const idx = pats.indexOf(s[1]);
      const u = unitAt(s[1]);
      return `<div class="sec" data-t="${s[0]}" title="${esc(u && u.s === s[1] ? u.n : 'pattern')} at ${romAddr(s[1])} — from ${fmtT(s[0] / tl.fps, it.seconds)}" style="left:${100 * s[0] / total}%;width:${100 * (end - s[0]) / total}%;--h:${CH_HUE[ch] + idx * 23};--a:${0.18 + 0.12 * (idx % 3)}">${esc(patternName(s[1]))}</div>`;
    }).join('') + '</div>';
  }).join('') + '<div class="ph"></div>';
  $$('#mstruct .sec').forEach(d => d.onclick = () => musicSeek(+d.dataset.t / tl.fps));
}

// --- tracker table: one row per frame where a note starts
const fmtCs = s => Math.floor(s / 60) + ':' + (s % 60).toFixed(2).padStart(5, '0');    // m:ss.cc
// a pattern's name (its label), shortened: Song05Pat3 -> Pat3
function patternName(addr) {
  const u = unitAt(addr);
  return u && u.s === addr ? u.n.replace(/^Song[0-9A-F]{2}/, '') : romShort(addr);
}
function buildTracker() {
  const tl = music.tl, it = music.item;
  const starts = new Map();
  tl.ch.forEach((ns, ch) => ns.forEach(n => { if (!starts.has(n.t)) starts.set(n.t, [null, null, null, null]); starts.get(n.t)[ch] = n; }));
  const rows = [...starts.keys()].sort((a, b) => a - b);
  music.trackRows = rows;
  const cell = (n, ch) => {
    if (!n) return '<td></td>';
    const v0 = n.v[0][1];
    const name = ch === 3 ? 'nz' : (n.f[0][1] < 2048 ? noteName(midiOf(hzOf(ch, n.f[0][1]))) : '?');
    const extra = [n.duty !== undefined ? 'd' + n.duty : '', n.wave !== undefined ? 'w' + (n.wave + 1) : '', n.env ? 'v' + n.env[0] + (n.env[2] ? (n.env[1] ? '↑' : '↓') + n.env[2] : '') : 'v' + v0,
      n.sweep ? 'sw' : '', n.noise ? 's' + n.noise[0] + 'd' + n.noise[2] : '', n.d + 'f'].filter(Boolean).join(' ');
    return `<td class="${n.own !== 'music' ? 'fx' : ''}" style="--cc:${chColor(ch, 1)}" title="${n.own !== 'music' ? esc(soundName(n.own)) : ''}${n.src !== undefined ? ' ' + romAddr(n.src) : ''}"><span class="n">${name}</span> <span class="x">${extra}</span></td>`;
  };
  $('#mtracker').innerHTML = `<table><tr><th>time</th>${CH_NAMES.map((n, i) => `<th style="color:${chColor(i, 1)}">${n}</th>`).join('')}</tr>` +
    rows.map(f => `<tr data-f="${f}"><td class="t">${fmtCs(f / tl.fps)}</td>${starts.get(f).map(cell).join('')}</tr>`).join('') + '</table>';
  $$('#mtracker tr[data-f]').forEach(r => r.onclick = () => musicSeek(+r.dataset.f / tl.fps));
}
function trackerFollow(frame) {
  const rows = music.trackRows || [];
  let lo = 0, hi = rows.length - 1, best = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (rows[m] <= frame) { best = m; lo = m + 1; } else hi = m - 1; }
  const prev = $('#mtracker tr.cur'); if (prev) prev.classList.remove('cur');
  if (best < 0) return;
  const tr = $$('#mtracker tr[data-f]')[best];
  if (tr) {
    tr.classList.add('cur');
    if (music.playing) { const box = $('#mtracker'); const y = tr.offsetTop - box.clientHeight * 0.35; if (Math.abs(box.scrollTop - y) > 4) box.scrollTop = y; }
  }
}
new ResizeObserver(() => { if (current.view === 'music') drawMusic(true); }).observe($('#mstage'));

timedRoute();
document.documentElement.dataset.ready = Math.round(performance.now());   // since navigation: download, parse, first view
</script>
</body>
